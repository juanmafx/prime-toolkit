name: CI

on:
  push:
    branches: [master, modernize/2026]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.5"
          enable-cache: false
      - run: uv sync --locked --no-install-project --no-build --python "${PYTHON_VERSION}"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q --cov=prime_maker --cov-report=term
      - run: uv build --out-dir "${RUNNER_TEMP}/dist"

  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.23.5", "24.22.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm test --ignore-scripts
        working-directory: javascript

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.5"
          enable-cache: false
      - run: uv export --locked --format requirements-txt --no-emit-project --quiet -o "${RUNNER_TEMP}/requirements.txt"
      - run: uvx pip-audit==2.10.1 --require-hashes --disable-pip -r "${RUNNER_TEMP}/requirements.txt"
